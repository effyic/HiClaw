[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agno-worker"
version = "0.1.0"
description = "HiClaw standalone Agno conversational worker (controller-injected AgentSpec)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "agno>=2.7.0a4",
    "openai>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "mcp>=1.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "uvicorn>=0.27",
    "fastapi>=0.109",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
agno-worker = "agno_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agno_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
