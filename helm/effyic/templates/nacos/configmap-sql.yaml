{{- if and .Values.nacos.enabled (eq .Values.nacos.mode "managed") (eq (.Values.nacos.database.platform | default "mysql") "postgresql") (eq (include "hiclaw.nacos.dbInitEnabled" .) "enabled") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hiclaw.nacos.fullname" . }}-sql
  namespace: {{ include "hiclaw.namespace" . }}
  labels:
    {{- $comp := dict "root" . "component" "nacos" }}
    {{- include "hiclaw.component.labels" $comp | nindent 4 }}
  annotations:
    # Must exist before nacos-db-init pre-install hook Job (hook-weight -10).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  init.sql: |
{{ .Files.Get "files/nacos-pg-schema.sql" | indent 4 }}
{{- end }}
