{{- if and .Values.nacos.enabled (eq .Values.nacos.mode "managed") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hiclaw.nacos.fullname" . }}
  namespace: {{ include "hiclaw.namespace" . }}
  labels:
    {{- $comp := dict "root" . "component" "nacos" }}
    {{- include "hiclaw.component.labels" $comp | nindent 4 }}
type: Opaque
stringData:
  MYSQL_SERVICE_USER: {{ .Values.nacos.mysql.username | quote }}
  MYSQL_SERVICE_PASSWORD: {{ .Values.nacos.mysql.password | quote }}
{{- end }}
