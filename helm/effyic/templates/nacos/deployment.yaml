{{- if and .Values.nacos.enabled (eq .Values.nacos.mode "managed") }}
{{- $comp := dict "root" . "component" "nacos" }}
{{- $db := .Values.nacos.database | default dict }}
{{- $platform := $db.platform | default "mysql" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hiclaw.nacos.fullname" . }}
  namespace: {{ include "hiclaw.namespace" . }}
  labels:
    {{- include "hiclaw.component.labels" $comp | nindent 4 }}
spec:
  replicas: {{ .Values.nacos.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "hiclaw.component.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hiclaw.component.selectorLabels" $comp | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $db.hostAliasIP }}
      hostAliases:
        - ip: {{ $db.hostAliasIP | quote }}
          hostnames:
            - {{ required "nacos.database.host is required when nacos.mode=managed" $db.host | quote }}
      {{- end }}
      containers:
        - name: nacos
          image: "{{ .Values.nacos.image.repository }}:{{ .Values.nacos.image.tag }}"
          imagePullPolicy: {{ .Values.nacos.image.pullPolicy | default "IfNotPresent" }}
          command:
            - bash
            - -c
            - ulimit -n 4096 && exec bin/docker-startup.sh
          ports:
            - name: client
              containerPort: {{ .Values.nacos.service.port | int }}
            - name: console
              containerPort: {{ .Values.nacos.service.consolePort | default 8080 | int }}
            - name: client-rpc
              containerPort: {{ add (.Values.nacos.service.port | int) 1000 }}
            - name: raft-rpc
              containerPort: {{ add (.Values.nacos.service.port | int) 1001 }}
          env:
            - name: MODE
              value: {{ .Values.nacos.serverMode | default "standalone" | quote }}
            - name: PREFER_HOST_MODE
              value: hostname
            - name: SPRING_DATASOURCE_PLATFORM
              value: {{ $platform | quote }}
            {{- if eq $platform "postgresql" }}
            - name: EMBEDDED_STORAGE
              value: "false"
            - name: DB_NUM
              value: "1"
            - name: DB_URL_0
              value: {{ printf "jdbc:postgresql://%s:%d/%s?%s" (required "nacos.database.host is required when nacos.mode=managed" $db.host) ($db.port | default 5432 | int) ($db.database | default "nacos") ($db.jdbcParams | default "currentSchema=public&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&reWriteBatchedInserts=true&ApplicationName=nacos_java") | quote }}
            - name: DB_USER_0
              valueFrom:
                secretKeyRef:
                  name: {{ include "hiclaw.nacos.fullname" . }}
                  key: DB_USER
            - name: DB_PASSWORD_0
              valueFrom:
                secretKeyRef:
                  name: {{ include "hiclaw.nacos.fullname" . }}
                  key: DB_PASSWORD
            - name: DB_POOL_CONFIG_DRIVERCLASSNAME
              value: org.postgresql.Driver
            {{- else if eq $platform "mysql" }}
            - name: MYSQL_SERVICE_HOST
              value: {{ required "nacos.database.host is required when nacos.mode=managed" $db.host | quote }}
            - name: MYSQL_SERVICE_PORT
              value: {{ $db.port | default 3306 | quote }}
            - name: MYSQL_SERVICE_DB_NAME
              value: {{ $db.database | default "nacos" | quote }}
            - name: MYSQL_SERVICE_DB_PARAM
              value: {{ $db.dbParam | quote }}
            - name: MYSQL_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hiclaw.nacos.fullname" . }}
                  key: DB_USER
            - name: MYSQL_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hiclaw.nacos.fullname" . }}
                  key: DB_PASSWORD
            {{- else }}
            {{- fail (printf "nacos.database.platform must be postgresql or mysql, got %q" $platform) }}
            {{- end }}
            - name: NACOS_AUTH_ENABLE
              value: {{ if hasKey .Values.nacos.auth "enabled" }}{{ .Values.nacos.auth.enabled | toString | quote }}{{ else }}"true"{{ end }}
            - name: NACOS_CORE_AUTH_ENABLED
              value: {{ if hasKey .Values.nacos.auth "enabled" }}{{ .Values.nacos.auth.enabled | toString | quote }}{{ else }}"true"{{ end }}
            - name: NACOS_AUTH_TOKEN
              value: {{ .Values.nacos.auth.token | quote }}
            - name: NACOS_AUTH_IDENTITY_KEY
              value: {{ .Values.nacos.auth.identityKey | quote }}
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: {{ .Values.nacos.auth.identityValue | quote }}
            {{- range $k, $v := .Values.nacos.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.nacos.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/readiness
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/liveness
              port: client
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
            - name: logs
              mountPath: /home/nacos/logs
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
{{- end }}
