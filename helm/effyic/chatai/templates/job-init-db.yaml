{{- if .Values.dbInit.enabled | default true }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chatai.fullname" . }}-db-init
  namespace: {{ include "chatai.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: chatai
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbInit.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ .Values.dbInit.activeDeadlineSeconds | default 600 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chatai.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: chatai-db-init
    spec:
      restartPolicy: OnFailure
      {{- $hostAliasIP := include "chatai.postgres.hostAliasIP" . }}
      {{- $pgHost := include "chatai.postgres.host" . }}
      {{- if and $hostAliasIP $pgHost }}
      hostAliases:
        - ip: {{ $hostAliasIP | quote }}
          hostnames:
            - {{ $pgHost | quote }}
      {{- end }}
      containers:
        - name: pg-init
          image: {{ .Values.dbInit.image | default "postgres:16-alpine" | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: {{ $pgHost | quote }}
            - name: PGPORT
              value: {{ include "chatai.postgres.port" . | quote }}
            - name: PGUSER
              value: {{ include "chatai.postgres.username" . | quote }}
            - name: PGPASSWORD
              value: {{ include "chatai.postgres.password" . | quote }}
            - name: PGDATABASE
              value: {{ include "chatai.postgres.database" . | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              echo "Initializing agno_agent schema on ${PGHOST}:${PGPORT}/${PGDATABASE}..."
              psql -v ON_ERROR_STOP=1 -f /sql/init.sql
              echo "Done."
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: {{ include "chatai.fullname" . }}-sql
{{- end }}
