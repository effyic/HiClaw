{{- if .Values.dbInit.enabled | default true }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chatai.fullname" . }}-db-init
  namespace: {{ include "chatai.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: chatai
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbInit.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chatai.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: chatai-db-init
    spec:
      restartPolicy: OnFailure
      {{- $hostAliasIP := .Values.dbInit.mysql.hostAliasIP }}
      {{- $mysqlHost := include "chatai.mysql.host" . }}
      {{- if and $hostAliasIP $mysqlHost }}
      hostAliases:
        - ip: {{ $hostAliasIP | quote }}
          hostnames:
            - {{ $mysqlHost | quote }}
      {{- end }}
      containers:
        - name: mysql-init
          image: {{ .Values.dbInit.image | default "mysql:8.0" | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: {{ $mysqlHost | quote }}
            - name: MYSQL_PORT
              value: {{ include "chatai.mysql.port" . | quote }}
            - name: MYSQL_USER
              value: {{ include "chatai.mysql.username" . | quote }}
            - name: MYSQL_PASSWORD
              value: {{ include "chatai.mysql.password" . | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              echo "Initializing agno_worker schema on ${MYSQL_HOST}:${MYSQL_PORT}..."
              mysql -h"${MYSQL_HOST}" -P"${MYSQL_PORT}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" < /sql/init.sql
              echo "Done."
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: {{ include "chatai.fullname" . }}-sql
{{- end }}
