{{- range $worker := .Values.workers | default (list (dict "name" "effyic-chatai")) }}
{{- $ctx := dict "root" $ "worker" $worker }}
---
apiVersion: hiclaw.io/v1beta1
kind: Worker
metadata:
  name: {{ $worker.name | quote }}
  namespace: {{ include "chatai.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: chatai
    hiclaw.io/controller: {{ include "chatai.hiclaw.controllerName" $ }}
spec:
  runtime: agno
  model: {{ $worker.model | default $.Values.credentials.defaultModel | quote }}
  modelProvider: {{ $worker.modelProvider | default $.Values.credentials.modelProvider | default "qwen" | quote }}
  image: {{ include "chatai.workerImage" $ctx | quote }}
  containerManaged: {{ $worker.containerManaged | default true }}
  {{- $pkg := include "chatai.workerPackage" $ctx }}
  {{- if $pkg }}
  package: {{ $pkg | quote }}
  {{- end }}
  {{- /* Default: expose container control API (8090) for port-forward / Higress */}}
  {{- $expose := $worker.expose }}
  {{- if not $expose }}
  {{- $expose = list (dict "port" ($worker.targetPort | default 8090) "protocol" "http") }}
  {{- end }}
  expose:
    {{- toYaml $expose | nindent 4 }}
  env:
    {{- include "chatai.workerEnv" $ctx | nindent 4 }}
  {{- if $worker.resources }}
  resources:
    {{- toYaml $worker.resources | nindent 4 }}
  {{- else if $.Values.resources }}
  resources:
    {{- toYaml $.Values.resources | nindent 4 }}
  {{- end }}
{{- end }}
