{{- if eq (include "chatai.sensitiveContentEnabled" .) "enabled" }}
{{- $sc := .Values.sensitiveContent | default dict }}
{{- $name := include "chatai.sensitiveContent.name" . }}
{{- $port := include "chatai.sensitiveContent.port" . | int }}
{{- if not (index $sc "existingSecret") }}
---
# Chart-managed runtime credentials Secret (skipped when
# sensitiveContent.existingSecret references a pre-created Secret). The admin
# token is shared with the primary ChatAI Worker and is not duplicated here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chatai.sensitiveContent.secretName" . }}
  namespace: {{ include "chatai.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sensitive-content
type: Opaque
stringData:
  SENSITIVE_CONTENT_RUNTIME_TOKEN: {{ include "chatai.sensitiveContent.runtimeToken" . | quote }}
  SENSITIVE_CONTENT_FINGERPRINT_KEY: {{ include "chatai.sensitiveContent.fingerprintKey" . | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "chatai.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sensitive-content
spec:
  replicas: {{ dig "replicas" 1 $sc }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sensitive-content
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chatai.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sensitive-content
    spec:
      {{- $hostAliasIP := include "chatai.postgres.hostAliasIP" . }}
      {{- $pgHost := include "chatai.postgres.host" . }}
      {{- if and $hostAliasIP $pgHost }}
      hostAliases:
        - ip: {{ $hostAliasIP | quote }}
          hostnames:
            - {{ $pgHost | quote }}
      {{- end }}
      containers:
        - name: sensitive-content
          image: {{ include "chatai.sensitiveContent.image" . | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sensitive-content", "serve"]
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: SENSITIVE_CONTENT_DB_URL
              value: {{ include "chatai.postgres.url" . | quote }}
            - name: SENSITIVE_CONTENT_PORT
              value: {{ $port | quote }}
            - name: SENSITIVE_CONTENT_RETENTION_DAYS
              value: {{ dig "retentionDays" 90 $sc | quote }}
            - name: SENSITIVE_CONTENT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "chatai.sensitiveContent.adminAuthSecretName" . }}
                  key: {{ .Values.auth.secretKey | default "CHATAI_API_TOKEN" }}
            - name: SENSITIVE_CONTENT_RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "chatai.sensitiveContent.secretName" . }}
                  key: SENSITIVE_CONTENT_RUNTIME_TOKEN
            - name: SENSITIVE_CONTENT_FINGERPRINT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "chatai.sensitiveContent.secretName" . }}
                  key: SENSITIVE_CONTENT_FINGERPRINT_KEY
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- if index $sc "resources" }}
          resources:
            {{- toYaml (index $sc "resources") | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "chatai.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sensitive-content
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sensitive-content
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
{{- if .Values.gateway.enabled | default true }}
{{- $publicPath := include "chatai.sensitiveContent.gatewayPath" . }}
{{- $host := .Values.gateway.host | default "" }}
---
# 管理/统计 API 网关路由：{{ $publicPath }}/* → /api/v1/tenants/*。
# 比 worker 的 {{ include "chatai.gatewayPath" . }} 前缀更长，Higress 按最长匹配优先，
# 不影响 /effyic/v1/chat 与 /effyic/v1/sessions；/internal/v1/* 不经网关暴露。
# 鉴权由服务自身完成，Bearer Token 与主 ChatAI Worker 的 API Token 相同。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-admin" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "chatai.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sensitive-content
    higress.io/resource-definer: higress
    {{- if $host }}
    higress.io/domain_{{ $host }}: "true"
    {{- else }}
    higress.io/domain_higress-default-domain: "true"
    {{- end }}
  annotations:
    # 前缀重写：{{ $publicPath }}/1/sensitive-rules → /api/v1/tenants/1/sensitive-rules。
    # 必须用 Prefix + rewrite-path（正则路由优先级低于 Prefix，会被 worker 的
    # {{ include "chatai.gatewayPath" . }} 前缀路由覆盖而失效）。
    higress.io/rewrite-path: "/api/v1/tenants"
    higress.io/ignore-path-case: "true"
    # X-Operator 仅信任网关注入，剥离客户端伪造值（服务端回退为 admin-token 主体）
    higress.io/request-header-control-remove: "X-Operator"
spec:
  ingressClassName: {{ .Values.gateway.ingressClassName | default "higress" | quote }}
  rules:
    - {{- if $host }}
      host: {{ $host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ $publicPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $port }}
  {{- $tlsSecret := .Values.gateway.tlsSecretName | default "default" }}
  {{- if and (not $host) $tlsSecret }}
  tls:
    - secretName: {{ $tlsSecret | quote }}
  {{- end }}
{{- end }}
{{- end }}
