{{- if .Values.gateway.enabled | default true }}
{{- $workers := .Values.workers | default (list (dict "name" "effyic-chatai")) }}
{{- $workerEntries := list }}
{{- range $worker := $workers }}
{{- $ctx := dict "root" $ "worker" $worker }}
{{- $workerEntries = append $workerEntries (printf "%s|%s|%s" (include "chatai.serviceSourceName" $ctx) (include "chatai.serviceDns" $ctx) (include "chatai.workerServicePort" $ctx)) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chatai.fullname" . }}-gateway-sync
  namespace: {{ include "chatai.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: chatai-gateway
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.gateway.sync.backoffLimit | default 5 }}
  activeDeadlineSeconds: {{ .Values.gateway.sync.activeDeadlineSeconds | default 120 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chatai.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: chatai-gateway
    spec:
      serviceAccountName: {{ include "chatai.fullname" . }}-gateway
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: {{ include "chatai.gatewaySyncImage" . | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ include "chatai.namespace" . | quote }}
            - name: MCP_BRIDGE_NAME
              value: {{ .Values.gateway.mcpBridgeName | default "default" | quote }}
            - name: MODE
              value: apply
            - name: WORKERS
              value: {{ join "," $workerEntries | quote }}
          command:
            - /bin/bash
            - /scripts/mcpbridge-sync.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "chatai.fullname" . }}-gateway-scripts
            defaultMode: 0755
{{- end }}
