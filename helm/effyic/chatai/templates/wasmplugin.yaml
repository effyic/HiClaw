{{- if and (.Values.gateway.enabled | default true) (.Values.gateway.keyAuth.enabled | default true) }}
{{- range $worker := .Values.workers | default (list (dict "name" "effyic-chatai")) }}
{{- $ctx := dict "root" $ "worker" $worker }}
{{- $consumer := $worker.gatewayConsumer | default $worker.name }}
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: {{ include "chatai.wasmPluginName" $ctx }}
  namespace: {{ include "chatai.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: higress-plugin
    higress.io/resource-definer: higress
    higress.io/wasm-plugin-built-in: "false"
    higress.io/wasm-plugin-name: key-auth
    higress.io/wasm-plugin-version: 1.0.0
    higress.io/wasm-plugin-category: auth
  annotations:
    higress.io/wasm-plugin-title: Key Auth
    higress.io/wasm-plugin-description: Authentication based on API Key for ChatAI route.
    higress.io/wasm-plugin-icon: https://img.alicdn.com/imgextra/i4/O1CN01BPFGlT1pGZ2VDLgaH_!!6000000005333-2-tps-42-42.png
spec:
  defaultConfigDisable: false
  failStrategy: FAIL_OPEN
  phase: AUTHN
  priority: 310
  defaultConfig:
    global_auth: false
    consumers:
      - name: {{ $consumer | quote }}
        credential: {{ include "chatai.authToken" $ctx | quote }}
    keys:
      {{- range $.Values.gateway.keyAuth.headerKeys | default (list "Authorization" "x-api-key") }}
      - {{ . | quote }}
      {{- end }}
    in_header: true
    in_query: {{ $.Values.gateway.keyAuth.allowQuery | default true }}
  matchRules:
    - ingress:
        - {{ printf "%s/%s" (include "chatai.namespace" $) (include "chatai.ingressName" $ctx) | quote }}
      configDisable: false
      config:
        allow:
          - {{ $consumer | quote }}
  url: {{ $.Values.gateway.keyAuth.pluginUrl | default "oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/key-auth:1.0.0" | quote }}
{{- end }}
{{- end }}
