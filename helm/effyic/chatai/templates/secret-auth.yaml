{{- range $worker := .Values.workers | default (list (dict "name" "effyic-chatai")) }}
{{- $ctx := dict "root" $ "worker" $worker }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chatai.authSecretName" $ctx }}
  namespace: {{ include "chatai.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ include "chatai.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: chatai
type: Opaque
stringData:
  {{ $.Values.auth.secretKey | default "CHATAI_API_TOKEN" }}: {{ include "chatai.authToken" $ctx | quote }}
{{- end }}
