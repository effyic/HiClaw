# 部署前替换占位符，或运行 ./apply-chatai.sh <worker-name> [namespace]
# 占位符：__WORKER_NAME__  __NAMESPACE__  __GATEWAY_KEY__
---
apiVersion: hiclaw.io/v1beta1
kind: Worker
metadata:
  name: __WORKER_NAME__
  labels:
    hiclaw.io/controller: effyic-controller
spec:
  runtime: agno
  model: qwen3.6-plus
  image: hiclaw/agno-worker:latest
  containerManaged: true
  # Controller 从 Nacos 拉取 AgentSpec 并写入 ConfigMap 挂载到 Pod。
  # 本地验证可改用 file:// 路径（需先将 agentspec 目录复制到 controller Pod）：
  # package: file:///tmp/agentspec/__WORKER_NAME__
  package: nacos://effyic-nacos:8848/public/medical-orchestrator?label:stable
  env:
    # 物理机 PostgreSQL（network_mode: host, 端口 5432）
    # 网关 IP 查询：docker network inspect minikube --format '{{(index .IPAM.Config 0).Gateway}}'
    AGNO_DB_URL: postgresql+psycopg://root:postgresql@192.168.49.1:5432/vector_store
  expose:
    - port: 8090
      protocol: http

---
apiVersion: v1
kind: Service
metadata:
  name: __WORKER_NAME__-chatai
  labels:
    app.kubernetes.io/name: __WORKER_NAME__
    app.kubernetes.io/component: chatai
spec:
  type: ClusterIP
  selector:
    hiclaw.io/worker: __WORKER_NAME__
  ports:
    - name: api
      port: 8090
      targetPort: 8090
      protocol: TCP
