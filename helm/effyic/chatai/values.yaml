# =============================================================================
# ChatAI Helm Chart — values.yaml
# =============================================================================

global:
  namespace: effyic  # must match HiClaw release namespace

# ── Reference to existing HiClaw installation ─────────────────────────────
hiclaw:
  releaseName: effyic       # required — pass via --set hiclaw.releaseName=...
  namespace: ""             # defaults to global.namespace
  controllerName: ""        # defaults to {releaseName}-controller
  controllerImage: ""       # hook Job image fallback; default hiclaw/hiclaw-controller:latest

# ── Credentials (Worker runtime) ──────────────────────────────────────────
credentials:
  defaultModel: qwen3.6-plus  # pass via --set credentials.defaultModel=...
  modelProvider: qwen         # Higress AI route provider; required for LLM gateway auth

# ── External PostgreSQL (session + tenant share one database) ─────────────
postgres:
  host: host.minikube.internal
  hostAliasIP: ""           # minikube: docker gateway IP (see deploy-minikube.md)
  port: 5432
  database: aip_hub_test    # required — Agno session + tenant config
  username: root
  password: postgresql

# ── PostgreSQL schema init (post-install Hook Job) ────────────────────────
dbInit:
  enabled: true             # false = skip CREATE DATABASE / schema import
  image: postgres:16-alpine
  backoffLimit: 3
  activeDeadlineSeconds: 600

# ── AgentSpec via Nacos (optional — controller fetches and mounts to Pod) ─
# agno-worker itself does NOT bind Nacos at build/runtime; it reads
# AGNO_AGENTSPEC_DIR (/etc/hiclaw/agentspec) or falls back to built-in default.
# When enabled=false, Worker CR has no spec.package; controller skips Nacos fetch.
agentspec:
  enabled: true               # false = use agno-worker built-in default AgentSpec
  dataId: medical-orchestrator
  label: stable

# ── Nacos (only used when agentspec.enabled=true) ─────────────────────────
nacos:
  host: ""                  # default: {hiclaw.releaseName}-nacos.{namespace}.svc.cluster.local
  port: 8848
  namespaceId: public
  username: nacos
  password: nacos

# ── Gateway / Ingress (platform path routing on shared Higress) ───────────
gateway:
  enabled: true
  ingressClassName: higress
  mcpBridgeName: default        # shared McpBridge service registry (same as HiClaw core)
  tlsSecretName: default        # TLS for default-domain routes; set "" to omit tls block
  publicURL: ""                 # align with core gateway.publicURL, e.g. http://localhost:80
  host: ""                      # empty = match all inbound hosts (path-based routing)
  path: /effyic                 # must match agno_worker CHAT_API_PREFIX
  sync:
    image: ""                 # defaults to hiclaw.controllerImage or hiclaw/hiclaw-controller:latest
    backoffLimit: 5
    activeDeadlineSeconds: 120
  keyAuth:
    enabled: true
    allowQuery: true
    headerKeys:
      - Authorization
      - x-api-key
    pluginUrl: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/key-auth:1.0.0

# ── API auth (auto-generated token stored in Secret) ──────────────────────
auth:
  token: ""                 # leave empty to auto-generate
  secretKey: CHATAI_API_TOKEN

# ── Worker defaults ───────────────────────────────────────────────────────
worker:
  image:
    repository: hiclaw/agno-worker
    tag: latest

globalEnv:
  AGNO_REQUIRE_TENANT_ID: "true"

resources: {}

workers:
  - name: effyic-chatai
    model: ""
    modelProvider: ""         # defaults to credentials.modelProvider (qwen)
    image: ""
    package: ""
    containerManaged: true
    servicePort: 8090
    targetPort: 8090
    gatewayHost: ""
    gatewayConsumer: ""
    env: {}
    resources: {}
    expose: []
