# =============================================================================
# ChatAI Helm Chart — values.yaml
# =============================================================================

global:
  namespace: effyic  # must match HiClaw release namespace

# ── Reference to existing HiClaw installation ─────────────────────────────
hiclaw:
  releaseName: effyic       # required — pass via --set hiclaw.releaseName=...
  namespace: ""             # defaults to global.namespace
  controllerName: ""        # defaults to {releaseName}-controller
  controllerImage: ""       # hook Job image fallback; default hiclaw/hiclaw-controller:latest

# ── Credentials (Worker runtime) ──────────────────────────────────────────
credentials:
  defaultModel: qwen3.6-plus  # pass via --set credentials.defaultModel=...
  modelProvider: qwen         # Higress AI route provider; required for LLM gateway auth

# ── External PostgreSQL (session + tenant share one database) ─────────────
postgres:
  host: host.minikube.internal
  hostAliasIP: ""           # minikube: docker gateway IP (see deploy-minikube.md)
  port: 5432
  database: aip_hub_test    # required — Agno session + tenant config
  username: root
  password: postgresql

# ── PostgreSQL schema init (post-install Hook Job) ────────────────────────
dbInit:
  enabled: true             # false = skip CREATE DATABASE / schema import
  image: postgres:16-alpine
  backoffLimit: 3
  activeDeadlineSeconds: 600

# ── AgentSpec via Nacos (optional — controller fetches and mounts to Pod) ─
# agno-worker itself does NOT bind Nacos at build/runtime; it reads
# AGNO_AGENTSPEC_DIR (/etc/hiclaw/agentspec) or falls back to built-in default.
# When enabled=false, Worker CR has no spec.package; controller skips Nacos fetch.
agentspec:
  enabled: true               # false = use agno-worker built-in default AgentSpec
  dataId: medical-orchestrator
  label: stable

# ── Nacos (only used when agentspec.enabled=true) ─────────────────────────
nacos:
  host: ""                  # default: {hiclaw.releaseName}-nacos.{namespace}.svc.cluster.local
  port: 8848
  namespaceId: public
  username: nacos
  password: nacos

# ── Gateway / Ingress (platform path routing on shared Higress) ───────────
gateway:
  enabled: true
  ingressClassName: higress
  mcpBridgeName: default        # shared McpBridge service registry (same as HiClaw core)
  tlsSecretName: default        # TLS for default-domain routes; set "" to omit tls block
  publicURL: ""                 # align with core gateway.publicURL, e.g. http://localhost:80
  host: ""                      # empty = match all inbound hosts (path-based routing)
  path: /effyic                 # must match agno_worker CHAT_API_PREFIX
  sync:
    image: ""                 # defaults to hiclaw.controllerImage or hiclaw/hiclaw-controller:latest
    backoffLimit: 5
    activeDeadlineSeconds: 120
  keyAuth:
    enabled: true
    allowQuery: true
    headerKeys:
      - Authorization
      - x-api-key
    pluginUrl: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/key-auth:1.0.0

# ── API auth (auto-generated token stored in Secret) ──────────────────────
auth:
  token: ""                 # leave empty to auto-generate
  secretKey: CHATAI_API_TOKEN

# ── Sensitive content moderation service (optional) ───────────────────────
# Rule/type management + policy snapshot service consumed by Agno Workers.
# Shares the chatai PostgreSQL database (dedicated sensitive_content schema);
# DDL is applied only by the pre-install/pre-upgrade migration Job.
#
# Fresh-install ordering constraint: the migration Job is a pre-install hook,
# while the db-init Job (which runs `CREATE DATABASE` when postgres.database
# does not exist yet) is post-install. On a brand-new install against a
# Postgres server where the target database has NOT been created yet, the
# migration Job will retry for up to 120s and then fail, aborting the install.
# Either pre-create postgres.database manually, or install first with
# `sensitiveContent.enabled=false` and enable it via `helm upgrade` afterwards
# (the pre-upgrade migration Job then finds the database created by db-init).
sensitiveContent:
  enabled: false
  image:
    repository: hiclaw/sensitive-content
    tag: latest
  replicas: 1
  port: 8091                # keep in sync with the image default SENSITIVE_CONTENT_PORT
  retentionDays: 90         # hit_event retention (days)
  resources: {}
  # Credentials — leave empty to auto-generate into a chart-managed Secret,
  # or set existingSecret to reference a pre-created Secret containing keys:
  #   SENSITIVE_CONTENT_ADMIN_TOKEN / SENSITIVE_CONTENT_RUNTIME_TOKEN /
  #   SENSITIVE_CONTENT_FINGERPRINT_KEY
  adminToken: ""            # management API token (platform admin)
  runtimeToken: ""          # internal API token (snapshot / hit-events)
  fingerprintKey: ""        # HMAC key for request/session fingerprints
  existingSecret: ""
  # Worker-side detection settings (injected into Agno Worker env)
  cachePath: /var/lib/agno/moderation/policy-snapshot.json
  refreshInterval: "30"     # snapshot refresh interval (seconds)
  maxStale: "600"           # max snapshot staleness before warning (seconds)
  failMode: open            # open = skip detection when no snapshot; closed = 503
  # Migration Job (helm.sh/hook: pre-install,pre-upgrade)
  migrate:
    backoffLimit: 3
    activeDeadlineSeconds: 300

# ── Worker defaults ───────────────────────────────────────────────────────
worker:
  image:
    repository: hiclaw/agno-worker
    tag: latest

globalEnv:
  AGNO_REQUIRE_TENANT_ID: "true"
  AGNO_ENABLE_SESSION_API: "true"
  AGNO_DEBUG_REQUEST_DEFAULT: "false"

resources: {}

workers:
  - name: effyic-chatai
    model: ""
    modelProvider: ""         # defaults to credentials.modelProvider (qwen)
    image: ""
    package: ""
    containerManaged: true
    servicePort: 8090
    targetPort: 8090
    gatewayHost: ""
    gatewayConsumer: ""
    env: {}
    resources: {}
    expose:
      - port: 8090
        protocol: http
